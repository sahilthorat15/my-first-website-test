<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>
</head>

<body>

    <h1>Hello World! 👋</h1>

    <p>
        This is my first website deployed using GitHub Pages.
    </p>

    <button onclick="sayHello()">
        Click Me
    </button>

    <p id="message"></p>

    <script>
        function sayHello() {
            document.getElementById("message").innerText =
                "My website is live! 🚀";
        }
    </script>

</body>
</html>
